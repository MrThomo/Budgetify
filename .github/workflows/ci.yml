name: CI - Build and Test

# Runs on every push / pull request to main, and can be started by hand.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android:
    name: Android - unit tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the exact Gradle version used by the project, so CI does not depend on a committed wrapper jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android-app/app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budgetify-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

  backend:
    name: Backend - build and test REST API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Budgetify.Api.Tests

      - name: Build
        run: dotnet build backend/Budgetify.Api.Tests --no-restore -c Release

      - name: Test
        run: dotnet test backend/Budgetify.Api.Tests --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/Budgetify.Api.Tests/TestResults
